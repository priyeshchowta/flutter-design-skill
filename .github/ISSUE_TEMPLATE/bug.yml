name: Bug
description: A rule, script, or snippet is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the rule id or the command you ran, and the output.
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: flutter --version
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
